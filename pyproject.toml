[project]
name = "ragbot"
version = "0.1.0"
description = "A local, CPU-only retrieval-augmented assistant over your own documents, with a LoRA fine-tune experiment."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "streamlit>=1.37",
    "ollama>=0.3",
    "pypdf>=4.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# Week 2: LoRA fine-tuning + benchmarking
finetune = [
    "transformers>=4.44",
    "peft>=0.12",
    "datasets>=2.21",
    "accelerate>=0.33",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
ragbot-ingest = "ragbot.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
